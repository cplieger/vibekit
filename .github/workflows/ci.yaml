name: CI

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - LICENSE
      - .gitignore
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - LICENSE
      - .gitignore
  workflow_dispatch:

jobs:
  go:
    uses: cplieger/ci/.github/workflows/go-ci.yaml@v1
    with:
      app: true
      dockerfile-lint: true
      working-directory: web
      go-version-file: web/go.mod

  web:
    uses: cplieger/ci/.github/workflows/ts-ci.yaml@v1
    with:
      working-directory: web/static-src
      web-lint: true
