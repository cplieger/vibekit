# gitleaks configuration for cplieger/vibekit
#
# THE [extend] BLOCK IS THE WHOLE SECRET GATE. Without it a config that defines
# no `[[rules]]` of its own defines no rules at all, and gitleaks then reports
# nothing whatever the tree contains. This file carried a legacy singular
# `[allowlist]` table and no `[extend]`, so the gate detected zero secrets for as
# long as it existed. Measured with gitleaks 8.30.1 against this tree with an
# obvious `ghp_` token planted at the repo root: the old config reported
# `no leaks found` on both `gitleaks dir .` and `gitleaks git .` (0 and 0), and
# adding nothing but the two lines below turned that into 4 tree findings, the
# planted token among them. Never delete `[extend]`, and never let this file
# reach a state where it defines neither rules nor an extend.
#
# Allowlists use the `[[allowlists]]` ARRAY form. The singular `[allowlist]`
# table is legacy and does not compose with a second entry.
#
# COUPLED TO THE SCANNER PIN IN ci.yaml. gitleaks-action bundles its own scanner
# and hard-codes 8.24.3, which silently IGNORES global `[[allowlists]]`: no
# error, no warning, the entries simply do nothing. If that version pin is ever
# removed, these allowlists go quiet and the findings below come back.

title = "vibekit gitleaks config"

# Extend the bundled default rule set rather than redefining it.
[extend]
useDefault = true

# ---------------------------------------------------------------------------
# Entry 1: the generic-api-key identifier heuristic over Go test fixtures
# ---------------------------------------------------------------------------
#
# Scoped with `targetRules` rather than allowlisting the paths outright, so ONLY
# the rule that actually misfires is relaxed. Every PROVIDER rule stays live
# over test files, which means a real credential pasted into a test is still
# caught. A blanket `paths` entry would have permitted it silently.
#
# Live case this was written for: internal/push/routes_test.go builds a Web Push
# subscription fixture whose JSON carries `keys`, `p256dh` and `auth` field
# names. The VAPID keys in it are generated by the test and the `auth` value is
# a deliberately-too-short 8-byte string the test asserts is REJECTED, but the
# surrounding identifiers are what generic-api-key matches on. Measured with
# gitleaks 8.30.1: 1 finding without this entry, 0 with it.
[[allowlists]]
description = "Go test fixtures carry `key`/`auth`/`token` field NAMES that match generic-api-key's identifier heuristic; the values are generated test material and rejection cases, not credentials."
targetRules = ["generic-api-key"]
paths = [
  '''_test\.go$''',
]

# ---------------------------------------------------------------------------
# Entry 2: the redactor's own token corpus, exempt from every rule
# ---------------------------------------------------------------------------
#
# internal/redact is a credential redactor, and internal/redact/redact_test.go is
# its corpus: it holds one fabricated token per provider SHAPE precisely so the
# redactor can be asserted to strip each of them. A GitLab `glpat-`, a GitHub
# `ghp_`, a Slack `xoxb-`, and AWS's own published documentation key
# `AKIAIOSFODNN7EXAMPLE`. That last one is the tell for the whole file: it is an
# example key AWS prints in its own docs, so these are published shapes rather
# than anything that ever authenticated.
#
# This entry carries NO `targetRules`, deliberately, and it is the only entry in
# this file that does not. Two of those fixtures trip `gitlab-pat`, a PROVIDER
# rule, so a generic-api-key-scoped entry cannot cover them, and enumerating one
# rule per shape would go stale the next time the corpus gains a provider. A
# file whose stated purpose is holding credential shapes is the one legitimate
# case for exempting a path from every rule.
#
# Both `gitlab-pat` hits also exist in HISTORY (commit 40791e6d), so this entry
# is what keeps `gitleaks git .` green too. A rename or an edit cannot reach
# history; only an allowlist can.
#
# THE TWO ENTRIES MUST NOT GROW INTO EACH OTHER. Entry 1 must never be widened
# to cover entry 2's job by dropping its `targetRules`, because that would blind
# every provider rule across every `_test.go` in the repo. Entry 2 must never be
# widened beyond this single named file, because its exemption is total and is
# justified only by that file's purpose.
[[allowlists]]
description = "The credential redactor's test corpus deliberately holds one fabricated token per provider shape (glpat-, ghp_, xoxb-, and AWS's published AKIAIOSFODNN7EXAMPLE documentation key) so the redactor can be asserted to strip them. Exempt from every rule because two shapes trip provider rules, not the identifier heuristic."
paths = [
  '''(^|/)internal/redact/redact_test\.go$''',
]
