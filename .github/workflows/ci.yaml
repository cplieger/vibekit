name: CI

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - LICENSE
      - .gitignore
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - LICENSE
      - .gitignore
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    uses: cplieger/ci/.github/workflows/go-ci.yaml@ee8299a163afa4aafff1471d5b83d1c4c228c8d6 # v1
    with:
      go-version-file: go.mod
  web:
    uses: cplieger/ci/.github/workflows/ts-ci.yaml@ee8299a163afa4aafff1471d5b83d1c4c228c8d6 # v1
    with:
      working-directory: static-src
      web-lint: true