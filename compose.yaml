services:
  vibekit:
    image: ghcr.io/cplieger/vibekit:latest
    container_name: vibekit
    restart: unless-stopped
    user: "0:0"  # required for config file permissions

    environment:
      TZ: "Europe/Paris"

    ports:
      - "9847:9847"

    volumes:
      - "/opt/appdata/vibekit/config:/config"
      - "/opt/appdata/vibekit/workspace:/workspace"
