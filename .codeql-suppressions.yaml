# CodeQL false-positive / accepted-by-design allowlist for ci-local.
# Keyed on the SARIF primaryLocationLineHash fingerprint. Every entry
# requires a `reason`. See tools/scripts/_ci_local.py load_suppressions().
suppressions:
  - rule: go/command-injection
    fingerprint: "eb9a4ae3fdf30950:1"
    path: internal/git/exec.go
    reason: >
      The flagged flow is a user-supplied clone URL passed to `git clone` —
      this IS the feature (cloning a repo the user names). It is mitigated by
      isAllowedRemoteScheme (https:// or git@ only), the `--` argument
      separator that stops flag injection, and the subcommand allowlist in
      gitExec. The taint is the URL value, not an attacker-chosen command.
      Accepted by design. Dismissed on the GitHub Security tab.
