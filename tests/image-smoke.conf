# Per-app config for the shared image-smoke harness (tests/image-smoke.sh,
# synced from cplieger/ci). Waits for the container HEALTHCHECK (HTTP GET
# /api/health on :9847) to report "healthy" - proving the server binds, the
# embedded static UI is present, and the health endpoint serves. vibekit
# installs dev tooling into /config on first boot, so the timeout is generous
# and exceeds the image's 60s HEALTHCHECK start-period.
SMOKE_APP_NAME=vibekit
SMOKE_TIMEOUT=240

# A SEEDED TEMPLATE MUST INSTALL WITH NO OPERATOR CONFIGURATION. That is the
# promise Settings -> Tools makes to a first-time user: the five templates a
# fresh volume carries are switch-on-and-go, and none of them may need an env
# var, a package or any other setup the user has not been told about.
#
# It is checked here because nothing else can check it. The build proves the
# image assembles, health proves the server binds, and the shell tests prove the
# entrypoint's refusals - but which OS libraries the tools engine's runtimes need
# is a property of UPSTREAM BINARIES this repo does not build and does not pin.
# It changed under us once: node's own linux-x64 build started linking
# libatomic.so.1 at v25, the image did not carry it, and every npm-sourced tool
# failed with `npm failed: exit status 127` while node's own row read clean. A
# green build, a healthy container and a passing unit suite all held throughout.
#
# The check installs `pyright` the way a user does - flip the template on - and
# that one gesture covers the whole chain: the baked catalog resolves the name,
# the engine adopts and installs the `node` backend, node has to RUN for npm to
# work at all (this is where a missing shared library surfaces), npm installs the
# package, and the engine's post-install probe executes what landed. Any link
# breaking fails the run. Deliberately NOT a hardcoded list of libraries to
# check: a list is a guess about upstream, and this is a measurement.
#
# The cost is one node download per docker job, and it does mean an upstream
# outage can fail this check. That is the accepted price: the failure prints the
# job's own error, so an unreachable mirror and a missing library do not read
# alike, and a re-run clears the former.
smoke_verify() {
  api() { docker exec "$SMOKE_CONTAINER" curl -fsS -X "$1" "http://127.0.0.1:9847/api/tools$2"; }

  # A template is installed by ENABLING it, never by POSTing install: install is
  # policy-neutral in the engine and answers 409 on a template. This is the exact
  # request the UI's row toggle sends.
  printf 'smoke: enabling the pyright template (installs node + pyright)\n' >&2
  docker exec "$SMOKE_CONTAINER" curl -fsS -X PATCH \
    -H 'Content-Type: application/json' -d '{"disabled":false}' \
    "http://127.0.0.1:9847/api/tools/pyright" >/dev/null

  # Deadline-bounded poll, not a sleep: it fails closed with the engine's own
  # diagnosis instead of flaking into a pass. Sized for a cold node download plus
  # an npm install on a shared runner.
  deadline=$(($(date +%s) + 300))
  while :; do
    inv=$(api GET "" || true)
    state=$(printf '%s' "$inv" | jq -r '.tools[] | select(.name=="pyright")
      | if .installed then "installed" elif .last_error != null and .last_error != "" then "error" else "pending" end' 2>/dev/null || true)
    [ "$state" = "installed" ] && break
    if [ "$state" = "error" ] || [ "$(date +%s)" -ge "$deadline" ]; then
      printf 'smoke: FAILED to install the pyright template (state=%s)\n' "${state:-unknown}" >&2
      # Both halves matter on failure: the rows carry each tool's own recorded
      # error (a broken backend now names itself rather than its dependents), and
      # the job log carries the loader message that says WHICH library is missing.
      printf '%s' "$inv" | jq -r '.tools[] | select(.name=="pyright" or .name=="node")
        | "  row \(.name): installed=\(.installed) error=\(.last_error // "")"' >&2 || true
      api GET "/jobs" | jq -r '(.active, .recent[]?) | select(. != null)
        | "  job \(.kind) \(.names // []) \(.state) \(.error // "")", (.output_tail[]? | "    | \(.)")' >&2 || true
      return 1
    fi
    sleep 5
  done

  # The backend is asserted too, and separately. A pyright row that reads
  # installed cannot prove node is healthy on its own - the engine records each
  # tool's own verdict - and node is the link that actually broke.
  printf '%s' "$inv" | jq -e '.tools[] | select(.name=="node") | .installed == true' >/dev/null \
    || { printf 'smoke: pyright installed but the node backend does not read installed\n' >&2; return 1; }

  printf 'smoke: pyright + node installed from a bare image, no operator configuration\n' >&2

  # AN ENGINE-INSTALLED TOOL MUST RESOLVE BY NAME IN THE SHELL THE USER TYPES
  # INTO. That shell is `bash --login` (internal/agent/shell.go), and Debian's
  # /etc/profile ASSIGNS PATH for uid 0 rather than appending -- so without
  # entrypoint.sh's /etc/profile.d/10-vibekit-path.sh drop-in a login shell
  # discards /config/tools/bin and everything the block above just installed is
  # unreachable by name there, while the tools UI reads clean.
  #
  # It is checked here because nothing else reaches it. The build boots no shell,
  # health only proves the server binds, and the entrypoint's shell unit tests
  # call the function against a scratch directory rather than a real /etc/profile
  # that overrides PATH first. It rides the block above rather than installing
  # anything of its own: that install is what makes a name worth resolving.
  #
  # Two steps so a failure names WHICH half broke -- the drop-in's effect on a
  # login shell's PATH, then a real tool resolving through it.
  login_path=$(docker exec "$SMOKE_CONTAINER" bash -lc 'printf %s "$PATH"' || true)
  case ":$login_path:" in
    *:/config/tools/bin:*) ;;
    *)
      printf 'smoke: a login shell lost the engine PATH dir - /etc/profile.d/10-vibekit-path.sh is missing or was not sourced (login PATH=%s)\n' "$login_path" >&2
      return 1
      ;;
  esac
  docker exec "$SMOKE_CONTAINER" bash -lc 'command -v pyright' >/dev/null \
    || {
      printf 'smoke: a login shell cannot resolve pyright by name although the engine installed it\n' >&2
      return 1
    }

  printf 'smoke: a login shell resolves an engine-installed tool through the profile.d PATH drop-in\n' >&2
}
